<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leitor de Música Offline</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    cores: {
                        tema1: { primario: '#0a192f', secundario: '#112240', destaque: '#64ffda', texto: '#ccd6f6' },
                        tema2: { primario: '#1a0f2e', secundario: '#2b1a47', destaque: '#d8b4fe', texto: '#e0d7f8' },
                        tema3: { primario: '#0f2e2e', secundario: '#1a4747', destaque: '#94e2d5', texto: '#e0f2f1' },
                        tema4: { primario: '#2e1a0f', secundario: '#472b1a', destaque: '#ffb74d', texto: '#fff3e0' },
                        tema5: { primario: '#2e0f1a', secundario: '#471a2b', destaque: '#f48fb1', texto: '#fce4ec' }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* === CÍRCULO CENTRAL === */
        .circulo-central {
            width: min(70vw, 320px);
            height: min(70vw, 320px);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(0,0,0,0.4), inset 0 0 30px rgba(255,255,255,0.05);
            transition: all 0.5s ease;
        }

        /* === VISUALIZADOR === */
        .visualizador {
            position: absolute;
            width: 75%;
            height: 75%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            z-index: 1;
            pointer-events: none;
        }
        .barra-visual {
            width: 5px;
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        /* === BOTÕES EXTERNOS === */
        .btn-controle-externo {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
            padding: 10px;
        }
        .btn-anterior { left: -55px; }
        .btn-proximo { right: -55px; }
        .btn-controle-externo:hover { transform: translateY(-50%) scale(1.2); }

        /* === BOTÃO PLAY/PAUSE === */
        .btn-play {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: none;
            outline: none;
        }
        .btn-play:hover { transform: scale(1.08); }
        .btn-play:active { transform: scale(0.95); }

        /* === BARRAS INFERIORES === */
        .barra-inferior {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px 32px;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            z-index: 10;
        }

        /* === SELETOR DE TEMA === */
        .seletor-tema {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 20;
            align-items: center;
        }
        .tema-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .tema-btn:hover, .tema-btn.active { transform: scale(1.2); border-color: white; }

        /* === INPUT RANGE === */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            outline: none;
            width: 100%;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
            border: none;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
            border: none;
        }

        /* === ÁREA DE UPLOAD === */
        .area-upload {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 20px;
        }
        .caixa-upload {
            text-align: center;
            padding: 32px 24px;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            max-width: 340px;
            width: 100%;
        }

        /* === CABEÇALHO === */
        .cabecalho {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 10px;
            text-align: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .titulo-musica {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }
        .nome-artista {
            font-size: 0.95rem;
            opacity: 0.75;
            margin-top: 4px;
        }

        /* === CENTRALIZAÇÃO PERFEITA === */
        .conteudo-central {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .escondido { display: none !important; }
    </style>
</head>
<body class="bg-tema1-primario text-tema1-texto font-sans">

    <!-- Seletor de Tema -->
    <div class="seletor-tema">
        <div class="tema-btn active" style="background:#0a192f" data-tema="1" title="Azul Escuro"></div>
        <div class="tema-btn" style="background:#1a0f2e" data-tema="2" title="Roxo Escuro"></div>
        <div class="tema-btn" style="background:#0f2e2e" data-tema="3" title="Verde Escuro"></div>
        <div class="tema-btn" style="background:#2e1a0f" data-tema="4" title="Laranja Escuro"></div>
        <div class="tema-btn" style="background:#2e0f1a" data-tema="5" title="Vermelho Escuro"></div>
    </div>

    <!-- Área de Seleção de Arquivos -->
    <div id="areaUpload" class="area-upload">
        <div class="caixa-upload">
            <i class="fa fa-music text-5xl mb-4 text-tema1-destaque"></i>
            <h2 class="text-xl font-bold mb-2">Bem-vindo</h2>
            <p class="mb-6 text-sm opacity-80">Selecione suas músicas para começar a ouvir</p>
            <label for="arquivosMusica" class="inline-block px-6 py-3 rounded-full bg-tema1-destaque text-tema1-primario font-bold cursor-pointer hover:scale-105 transition-transform">
                <i class="fa fa-plus mr-2"></i> Adicionar Músicas
            </label>
            <input type="file" id="arquivosMusica" accept=".mp3,.wav,.ogg,.m4a" multiple class="hidden">
        </div>
    </div>

    <!-- Cabeçalho — Título e Artista -->
    <header id="cabecalho" class="cabecalho escondido">
        <h1 id="nomeMusicaAtual" class="titulo-musica">---</h1>
        <p id="nomeArtista" class="nome-artista">---</p>
    </header>

    <!-- Área Central — Círculo do Leitor -->
    <main class="conteudo-central">
        <div class="circulo-central bg-tema1-secundario/80 backdrop-blur-md border border-white/10">
            <!-- Visualizador de Áudio -->
            <div id="visualizador" class="visualizador"></div>

            <!-- Botão Play/Pause -->
            <button id="btnPlayPause" class="btn-play bg-tema1-destaque text-tema1-primario">
                <i class="fa fa-play"></i>
            </button>

            <!-- Botões Externos -->
            <button id="btnAnterior" class="btn-controle-externo btn-anterior text-tema1-destaque">
                <i class="fa fa-step-backward"></i>
            </button>
            <button id="btnProximo" class="btn-controle-externo btn-proximo text-tema1-destaque">
                <i class="fa fa-step-forward"></i>
            </button>
        </div>
    </main>

    <!-- Barras Inferiores — Progresso e Volume -->
    <div id="barrasInferiores" class="barra-inferior escondido">
        <div class="mb-3">
            <div class="flex justify-between text-xs mb-1 opacity-75">
                <span id="tempoAtual">0:00</span>
                <span id="tempoTotal">0:00</span>
            </div>
            <input type="range" id="barraProgresso" min="0" max="100" value="0" class="bg-white/20">
        </div>
        <div class="flex items-center gap-3">
            <i class="fa fa-volume-up text-sm opacity-75"></i>
            <input type="range" id="controleVolume" min="0" max="100" value="80" class="flex-1 bg-white/20">
        </div>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="reprodutor" preload="metadata">

    <script>
        // === VARIÁVEIS PRINCIPAIS ===
        const reprodutor = document.getElementById('reprodutor');
        const arquivosMusica = document.getElementById('arquivosMusica');
        const nomeMusicaAtual = document.getElementById('nomeMusicaAtual');
        const nomeArtista = document.getElementById('nomeArtista');
        const tempoAtual = document.getElementById('tempoAtual');
        const tempoTotal = document.getElementById('tempoTotal');
        const barraProgresso = document.getElementById('barraProgresso');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnAnterior = document.getElementById('btnAnterior');
        const btnProximo = document.getElementById('btnProximo');
        const controleVolume = document.getElementById('controleVolume');
        const areaUpload = document.getElementById('areaUpload');
        const cabecalho = document.getElementById('cabecalho');
        const barrasInferiores = document.getElementById('barrasInferiores');
        const visualizador = document.getElementById('visualizador');
        const botoesTema = document.querySelectorAll('.tema-btn');

        let musicas = [];
        let indiceAtual = -1;
        let animacaoVisualizador;
        let contextoAudio;
        let analisador;
        let dadosFrequencia;

        // === PALETA DE CORES ===
        const temas = {
            1: { primario: '#0a192f', secundario: '#112240', destaque: '#64ffda', texto: '#ccd6f6' },
            2: { primario: '#1a0f2e', secundario: '#2b1a47', destaque: '#d8b4fe', texto: '#e0d7f8' },
            3: { primario: '#0f2e2e', secundario: '#1a4747', destaque: '#94e2d5', texto: '#e0f2f1' },
            4: { primario: '#2e1a0f', secundario: '#472b1a', destaque: '#ffb74d', texto: '#fff3e0' },
            5: { primario: '#2e0f1a', secundario: '#471a2b', destaque: '#f48fb1', texto: '#fce4ec' }
        };

        // === SELEÇÃO DE TEMA ===
        botoesTema.forEach(botao => {
            botao.addEventListener('click', () => {
                botoesTema.forEach(b => b.classList.remove('active'));
                botao.classList.add('active');
                const idTema = botao.dataset.tema;
                aplicarTema(idTema);
                localStorage.setItem('temaSelecionado', idTema);
            });
        });

        function aplicarTema(id) {
            const t = temas[id];
            document.body.style.backgroundColor = t.primario;
            document.body.style.color = t.texto;
            document.querySelector('.circulo-central').style.backgroundColor = t.secundario + 'cc';
            document.querySelector('.btn-play').style.backgroundColor = t.destaque;
            document.querySelector('.btn-play').style.color = t.primario;
            document.querySelectorAll('.btn-controle-externo').forEach(b => b.style.color = t.destaque);
            document.querySelector('meta[name="theme-color"]').content = t.primario;
            // Atualizar cor do visualizador
            document.querySelectorAll('.barra-visual').forEach(b => b.style.backgroundColor = t.destaque);
        }

        // === INICIALIZAÇÃO ===
        window.addEventListener('load', () => {
            const temaSalvo = localStorage.getItem('temaSelecionado') || '1';
            botoesTema.forEach(b => b.classList.toggle('active', b.dataset.tema === temaSalvo));
            aplicarTema(temaSalvo);
            controleVolume.value = 80;
            reprodutor.volume = 0.8;
        });

        // === ADICIONAR MÚSICAS ===
        arquivosMusica.addEventListener('change', (e) => {
            const arquivos = Array.from(e.target.files);
            arquivos.forEach(arquivo => {
                if (arquivo.type.startsWith('audio/') || arquivo.name.endsWith('.m4a')) {
                    musicas.push({
                        id: Date.now() + Math.random(),
                        nome: arquivo.name.replace(/\.[^/.]+$/, ""),
                        arquivo: arquivo,
                        url: URL.createObjectURL(arquivo),
                        artista: 'Desconhecido'
                    });
                }
            });
            if (musicas.length > 0) {
                areaUpload.classList.add('escondido');
                cabecalho.classList.remove('escondido');
                barrasInferiores.classList.remove('escondido');
                reproduzirMusica(0);
                inicializarVisualizador();
            }
        });

        // === REPRODUZIR MÚSICA ===
        function reproduzirMusica(indice) {
            if (indice < 0 || indice >= musicas.length) return;
            indiceAtual = indice;
            const musica = musicas[indice];
            
            reprodutor.src = musica.url;
            reprodutor.play().catch(() => {});
            
            nomeMusicaAtual.textContent = musica.nome;
            nomeArtista.textContent = musica.artista;
            btnPlayPause.innerHTML = '<i class="fa fa-pause"></i>';
        }

        // === CONTROLES ===
        btnPlayPause.addEventListener('click', () => {
            if (musicas.length === 0) return;
            if (reprodutor.paused) {
                reprodutor.play().catch(() => {});
                btnPlayPause.innerHTML = '<i class="fa fa-pause"></i>';
            } else {
                reprodutor.pause();
                btnPlayPause.innerHTML = '<i class="fa fa-play"></i>';
            }
        });

        btnAnterior.addEventListener('click', () => reproduzirMusica((indiceAtual - 1 + musicas.length) % musicas.length));
        btnProximo.addEventListener('click', () => reproduzirMusica((indiceAtual + 1) % musicas.length));
        reprodutor.addEventListener('ended', () => btnProximo.click());

        // === BARRA DE PROGRESSO ===
        reprodutor.addEventListener('timeupdate', () => {
            if (!isNaN(reprodutor.duration)) {
                const progresso = (reprodutor.currentTime / reprodutor.duration) * 100;
                barraProgresso.value = progresso;
                tempoAtual.textContent = formatarTempo(reprodutor.currentTime);
                tempoTotal.textContent = formatarTempo(reprodutor.duration);
            }
        });
        barraProgresso.addEventListener('input', () => {
            if (!isNaN(reprodutor.duration)) {
                reprodutor.currentTime = (barraProgresso.value / 100) * reprodutor.duration;
            }
        });

        // === VOLUME ===
        controleVolume.addEventListener('input', () => reprodutor.volume = controleVolume.value / 100);

        // === FORMATAR TEMPO ===
        function formatarTempo(segundos) {
            if (isNaN(segundos)) return '0:00';
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg.toString().padStart(2, '0')}`;
        }

        // === VISUALIZADOR DE ÁUDIO ===
        function inicializarVisualizador() {
            if (!contextoAudio) {
                contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
                analisador = contextoAudio.createAnalyser();
                analisador.fftSize = 64;
                dadosFrequencia = new Uint8Array(analisador.frequencyBinCount);

                const fonte = contextoAudio.createMediaElementSource(reprodutor);
                fonte.connect(analisador);
                analisador.connect(contextoAudio.destination);

                // Criar barras do visualizador
                visualizador.innerHTML = '';
                for (let i = 0; i < 16; i++) {
                    const barra = document.createElement('div');
                    barra.classList.add('barra-visual');
                    const corDestaque = temas[localStorage.getItem('temaSelecionado') || '1'].destaque;
                    barra.style.backgroundColor = corDestaque;
                    visualizador.appendChild(barra);
                }
            }

            animarVisualizador();
        }

        function animarVisualizador() {
            if (!analisador) return;
            analisador.getByteFrequencyData(dadosFrequencia);
            const barras = visualizador.querySelectorAll('.barra-visual');
            const alturaMax = 110;

            barras.forEach((barra, i) => {
                const valor = dadosFrequencia[i * 2] / 255;
                barra.style.height = `${valor * alturaMax}px`;
            });

            animacaoVisualizador = requestAnimationFrame(animarVisualizador);
        }

        // Retomar contexto de áudio
        reprodutor.addEventListener('play', () => {
            if (contextoAudio && contextoAudio.state === 'suspended') contextoAudio.resume();
        });
    </script>
</body>
</html>
