<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leitor de Música Offline</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    cores: {
                        tema1: { primario: '#0a192f', secundario: '#112240', destaque: '#64ffda', texto: '#ccd6f6' },
                        tema2: { primario: '#1a0f2e', secundario: '#2b1a47', destaque: '#d8b4fe', texto: '#e0d7f8' },
                        tema3: { primario: '#0f2e2e', secundario: '#1a4747', destaque: '#94e2d5', texto: '#e0f2f1' },
                        tema4: { primario: '#2e1a0f', secundario: '#472b1a', destaque: '#ffb74d', texto: '#fff3e0' },
                        tema5: { primario: '#2e0f1a', secundario: '#471a2b', destaque: '#f48fb1', texto: '#fce4ec' }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* === CÍRCULO CENTRAL === */
        .circulo-central {
            width: min(70vw, 320px);
            height: min(70vw, 320px);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(0,0,0,0.4), inset 0 0 30px rgba(255,255,255,0.05);
            transition: all 0.5s ease;
            overflow: hidden;
        }

        /* === CAPA DA MÚSICA === */
        .capa-musica {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.4;
            transition: opacity 0.5s ease;
            z-index: 0;
        }

        /* === VISUALIZADOR === */
        .visualizador {
            position: absolute;
            width: 75%;
            height: 75%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            z-index: 2;
            pointer-events: none;
        }
        .barra-visual {
            width: 5px;
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        /* === BOTÃO PLAY/PAUSE === */
        .btn-play {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: none;
            outline: none;
            background: rgba(255,255,255,0.95);
            color: #0a192f;
        }
        .btn-play:hover { transform: scale(1.08); }
        .btn-play:active { transform: scale(0.95); }

        /* === BOTÕES EXTERNOS — RESTAURADOS === */
        .btn-controle-externo {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 5;
            padding: 10px 15px;
        }
        .btn-anterior { left: -65px; }
        .btn-proximo { right: -65px; }
        .btn-controle-externo:hover { transform: translateY(-50%) scale(1.25); }

        /* === BARRA DE PROGRESSO CIRCULAR === */
        .progresso-circular {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .progresso-circular svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .progresso-circular circle {
            fill: none;
            stroke-width: 6;
        }
        .progresso-fundo {
            stroke: rgba(255,255,255,0.15);
        }
        .progresso-ativo {
            stroke: #64ffda;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 0.1s linear;
        }

        /* === TEMPO ABAIXO DO CÍRCULO === */
        .tempo-container {
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
            opacity: 0.8;
            z-index: 5;
        }

        /* === VOLUME === */
        .btn-volume {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            color: #ccd6f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s;
        }
        .btn-volume:hover { background: rgba(255,255,255,0.15); }
        .volume-popup {
            position: fixed;
            bottom: 80px;
            right: 24px;
            width: 52px;
            height: 180px;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 26px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 21;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .volume-popup.aberto { opacity: 1; visibility: visible; }
        .volume-slider {
            width: 6px;
            height: 120px;
            border-radius: 3px;
            background: rgba(255,255,255,0.2);
            position: relative;
            cursor: pointer;
        }
        .volume-slider-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #64ffda;
            border-radius: 3px;
            transition: height 0.08s linear;
        }
        .volume-porcentagem {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64ffda;
            margin-top: 4px;
        }

        /* === CARROSSEL DE TÍTULO === */
        .titulo-wrapper {
            overflow: hidden;
            width: 100%;
            max-width: 86vw;
        }
        .titulo-carrossel {
            display: inline-block;
            white-space: nowrap;
            animation: carrossel 12s linear infinite;
        }
        @keyframes carrossel {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .titulo-pausado .titulo-carrossel { animation-play-state: paused; }

        /* === SELETOR DE TEMA === */
        .seletor-tema {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 20;
            align-items: center;
        }
        .tema-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .tema-btn:hover, .tema-btn.active { transform: scale(1.2); border-color: white; }

        /* === ÁREA DE UPLOAD === */
        .area-upload {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 20px;
        }
        .caixa-upload {
            text-align: center;
            padding: 32px 24px;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            max-width: 340px;
            width: 100%;
        }

        /* === CABEÇALHO === */
        .cabecalho {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 10px;
            text-align: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .titulo-musica {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
        }
        .nome-artista {
            font-size: 0.95rem;
            opacity: 0.75;
            margin-top: 4px;
        }

        /* === CENTRALIZAÇÃO PERFEITA === */
        .conteudo-central {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .escondido { display: none !important; }
    </style>
</head>
<body class="bg-tema1-primario text-tema1-texto font-sans">

    <!-- Seletor de Tema -->
    <div class="seletor-tema">
        <div class="tema-btn active" style="background:#0a192f" data-tema="1" title="Azul Escuro"></div>
        <div class="tema-btn" style="background:#1a0f2e" data-tema="2" title="Roxo Escuro"></div>
        <div class="tema-btn" style="background:#0f2e2e" data-tema="3" title="Verde Escuro"></div>
        <div class="tema-btn" style="background:#2e1a0f" data-tema="4" title="Laranja Escuro"></div>
        <div class="tema-btn" style="background:#2e0f1a" data-tema="5" title="Vermelho Escuro"></div>
    </div>

    <!-- Área de Seleção de Arquivos -->
    <div id="areaUpload" class="area-upload">
        <div class="caixa-upload">
            <i class="fa fa-music text-5xl mb-4 text-tema1-destaque"></i>
            <h2 class="text-xl font-bold mb-2">Bem-vindo</h2>
            <p class="mb-6 text-sm opacity-80">Selecione suas músicas para começar a ouvir</p>
            <label for="arquivosMusica" class="inline-block px-6 py-3 rounded-full bg-tema1-destaque text-tema1-primario font-bold cursor-pointer hover:scale-105 transition-transform">
                <i class="fa fa-plus mr-2"></i> Adicionar Músicas
            </label>
            <input type="file" id="arquivosMusica" accept=".mp3,.wav,.ogg,.m4a" multiple class="hidden">
        </div>
    </div>

    <!-- Cabeçalho — Título e Artista com Carrossel -->
    <header id="cabecalho" class="cabecalho escondido">
        <div class="titulo-wrapper">
            <div id="tituloCarrossel" class="titulo-carrossel">
                <span id="nomeMusicaAtual" class="titulo-musica">---</span>
                <span class="mx-8">•</span>
                <span id="nomeMusicaAtualDup" class="titulo-musica">---</span>
            </div>
        </div>
        <p id="nomeArtista" class="nome-artista">---</p>
    </header>

    <!-- Área Central -->
    <main class="conteudo-central">
        <!-- Círculo do Leitor -->
        <div class="circulo-central bg-tema1-secundario/80 backdrop-blur-md border border-white/10">
            <!-- Capa da Música — CORRIGIDO -->
            <div id="capaMusica" class="capa-musica" style="background-image: none;"></div>

            <!-- Barra de Progresso Circular -->
            <div class="progresso-circular">
                <svg viewBox="0 0 100 100">
                    <circle class="progresso-fundo" cx="50" cy="50" r="46"></circle>
                    <circle id="progressoAtivo" class="progresso-ativo" cx="50" cy="50" r="46"></circle>
                </svg>
            </div>

            <!-- Visualizador de Áudio -->
            <div id="visualizador" class="visualizador"></div>

            <!-- Botão Play/Pause -->
            <button id="btnPlayPause" class="btn-play">
                <i class="fa fa-play"></i>
            </button>

            <!-- ✅ BOTÕES RECUAR E AVANÇAR — RESTAURADOS -->
            <button id="btnAnterior" class="btn-controle-externo btn-anterior text-tema1-destaque">
                <i class="fa fa-step-backward"></i>
            </button>
            <button id="btnProximo" class="btn-controle-externo btn-proximo text-tema1-destaque">
                <i class="fa fa-step-forward"></i>
            </button>
        </div>

        <!-- Tempo Abaixo do Círculo -->
        <div id="tempoContainer" class="tempo-container escondido">
            <span id="tempoAtual">0:00</span>
            <span class="mx-2">/</span>
            <span id="tempoTotal">0:00</span>
        </div>
    </main>

    <!-- Volume -->
    <div id="btnVolume" class="btn-volume escondido">
        <i class="fa fa-volume-up"></i>
    </div>

    <div id="volumePopup" class="volume-popup">
        <span class="volume-porcentagem" id="volumePorcentagem">80%</span>
        <div class="volume-slider" id="volumeSlider">
            <div class="volume-slider-fill" id="volumeSliderFill" style="height: 80%"></div>
        </div>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="reprodutor" preload="metadata">

    <script>
        // === VARIÁVEIS PRINCIPAIS ===
        const reprodutor = document.getElementById('reprodutor');
        const arquivosMusica = document.getElementById('arquivosMusica');
        const nomeMusicaAtual = document.getElementById('nomeMusicaAtual');
        const nomeMusicaAtualDup = document.getElementById('nomeMusicaAtualDup');
        const nomeArtista = document.getElementById('nomeArtista');
        const tempoAtual = document.getElementById('tempoAtual');
        const tempoTotal = document.getElementById('tempoTotal');
        const progressoAtivo = document.getElementById('progressoAtivo');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnAnterior = document.getElementById('btnAnterior');
        const btnProximo = document.getElementById('btnProximo');
        const areaUpload = document.getElementById('areaUpload');
        const cabecalho = document.getElementById('cabecalho');
        const tempoContainer = document.getElementById('tempoContainer');
        const btnVolume = document.getElementById('btnVolume');
        const volumePopup = document.getElementById('volumePopup');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeSliderFill = document.getElementById('volumeSliderFill');
        const volumePorcentagem = document.getElementById('volumePorcentagem');
        const visualizador = document.getElementById('visualizador');
        const capaMusica = document.getElementById('capaMusica');
        const botoesTema = document.querySelectorAll('.tema-btn');

        let musicas = [];
        let indiceAtual = -1;
        let animacaoVisualizador;
        let contextoAudio;
        let analisador;
        let dadosFrequencia;
        let sliderVolumeDragging = false;

        // === PALETA DE CORES ===
        const temas = {
            1: { primario: '#0a192f', secundario: '#112240', destaque: '#64ffda', texto: '#ccd6f6' },
            2: { primario: '#1a0f2e', secundario: '#2b1a47', destaque: '#d8b4fe', texto: '#e0d7f8' },
            3: { primario: '#0f2e2e', secundario: '#1a4747', destaque: '#94e2d5', texto: '#e0f2f1' },
            4: { primario: '#2e1a0f', secundario: '#472b1a', destaque: '#ffb74d', texto: '#fff3e0' },
            5: { primario: '#2e0f1a', secundario: '#471a2b', destaque: '#f48fb1', texto: '#fce4ec' }
        };

        // === SELEÇÃO DE TEMA ===
        botoesTema.forEach(botao => {
            botao.addEventListener('click', () => {
                botoesTema.forEach(b => b.classList.remove('active'));
                botao.classList.add('active');
                const idTema = botao.dataset.tema;
                aplicarTema(idTema);
                localStorage.setItem('temaSelecionado', idTema);
            });
        });

        function aplicarTema(id) {
            const t = temas[id];
            document.body.style.backgroundColor = t.primario;
            document.body.style.color = t.texto;
            document.querySelector('.circulo-central').style.backgroundColor = t.secundario + 'cc';
            document.querySelectorAll('.btn-controle-externo').forEach(b => b.style.color = t.destaque);
            progressoAtivo.style.stroke = t.destaque;
            volumeSliderFill.style.background = t.destaque;
            volumePorcentagem.style.color = t.destaque;
            document.querySelector('meta[name="theme-color"]').content = t.primario;
            document.querySelectorAll('.barra-visual').forEach(b => b.style.backgroundColor = t.destaque);
        }

        // === INICIALIZAÇÃO ===
        window.addEventListener('load', () => {
            const temaSalvo = localStorage.getItem('temaSelecionado') || '1';
            botoesTema.forEach(b => b.classList.toggle('active', b.dataset.tema === temaSalvo));
            aplicarTema(temaSalvo);
            reprodutor.volume = 0.8;
            atualizarVolumeUI(0.8);
        });

        // === ADICIONAR MÚSICAS ===
        arquivosMusica.addEventListener('change', (e) => {
            const arquivos = Array.from(e.target.files);
            arquivos.forEach(arquivo => {
                if (arquivo.type.startsWith('audio/') || arquivo.name.endsWith('.m4a')) {
                    musicas.push({
                        id: Date.now() + Math.random(),
                        nome: arquivo.name.replace(/\.[^/.]+$/, ""),
                        arquivo: arquivo,
                        url: URL.createObjectURL(arquivo),
                        artista: 'Desconhecido',
                        capa: null
                    });
                }
            });
            if (musicas.length > 0) {
                areaUpload.classList.add('escondido');
                cabecalho.classList.remove('escondido');
                tempoContainer.classList.remove('escondido');
                btnVolume.classList.remove('escondido');
                reproduzirMusica(0);
                inicializarVisualizador();
            }
        });

        // === REPRODUZIR MÚSICA ===
        function reproduzirMusica(indice) {
            if (indice < 0 || indice >= musicas.length) return;
            indiceAtual = indice;
            const musica = musicas[indice];

            reprodutor.src = musica.url;
            reprodutor.play().catch(() => {});

            nomeMusicaAtual.textContent = musica.nome;
            nomeMusicaAtualDup.textContent = musica.nome;
            nomeArtista.textContent = musica.artista;
            btnPlayPause.innerHTML = '<i class="fa fa-pause"></i>';

            // Reseta carrossel
            const wrapper = document.querySelector('.titulo-wrapper');
            wrapper.classList.add('titulo-pausado');
            setTimeout(() => wrapper.classList.remove('titulo-pausado'), 10);

            // ✅ CARGA DE CAPA — CORRIGIDO E MELHORADO
            carregarCapaMusica(musica);
        }

        // ✅ FUNÇÃO DE CARGA DE CAPA — REFEITA COMPLETAMENTE
        function carregarCapaMusica(musica) {
            // Limpa a capa anterior
            capaMusica.style.backgroundImage = 'none';
            capaMusica.style.opacity = '0';

            // Se já tem capa salva, usa diretamente
            if (musica.capa) {
                capaMusica.style.backgroundImage = `url(${musica.capa})`;
                capaMusica.style.opacity = '0.4';
                return;
            }

            // Tenta extrair metadados com a biblioteca nativa
            if ('mediaMetadata' in navigator) {
                // Fallback: tenta ler como imagem embutida
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    const dados = new Uint8Array(e.target.result);
                    // Procura por assinaturas de imagem (ID3/APIC)
                    let pos = 0;
                    while (pos < dados.length - 10) {
                        // Encontra marcador de imagem JPEG/PNG
                        if ((dados[pos] === 0xFF && dados[pos+1] === 0xD8) || // JPEG
                            (dados[pos] === 0x89 && dados[pos+1] === 0x50)) { // PNG
                            const blob = new Blob([dados.subarray(pos)], {type: 'image/*'});
                            const urlImagem = URL.createObjectURL(blob);
                            musica.capa = urlImagem;
                            capaMusica.style.backgroundImage = `url(${urlImagem})`;
                            capaMusica.style.opacity = '0.4';
                            break;
                        }
                        pos++;
                    }
                };
                leitor.readAsArrayBuffer(musica.arquivo.slice(0, 1024 * 1024)); // Lê 1MB para procurar capa
            }

            // Alternativa: usa URL de dados como base
            const tempImg = new Image();
            tempImg.onload = () => {
                musica.capa = tempImg.src;
                capaMusica.style.backgroundImage = `url(${tempImg.src})`;
                capaMusica.style.opacity = '0.4';
            };
            tempImg.onerror = () => {
                // Se não houver capa, mantém sem imagem — não mostra erro
            };
        }

        // === CONTROLES ===
        btnPlayPause.addEventListener('click', () => {
            if (musicas.length === 0) return;
            if (reprodutor.paused) {
                reprodutor.play().catch(() => {});
                btnPlayPause.innerHTML = '<i class="fa fa-pause"></i>';
            } else {
                reprodutor.pause();
                btnPlayPause.innerHTML = '<i class="fa fa-play"></i>';
            }
        });

        btnAnterior.addEventListener('click', () => reproduzirMusica((indiceAtual - 1 + musicas.length) % musicas.length));
        btnProximo.addEventListener('click', () => reproduzirMusica((indiceAtual + 1) % musicas.length));
        reprodutor.addEventListener('ended', () => btnProximo.click());

        // === BARRA DE PROGRESSO CIRCULAR ===
        reprodutor.addEventListener('timeupdate', () => {
            if (!isNaN(reprodutor.duration)) {
                const progresso = reprodutor.currentTime / reprodutor.duration;
                const offset = 1000 - (1000 * progresso);
                progressoAtivo.style.strokeDashoffset = offset;
                tempoAtual.textContent = formatarTempo(reprodutor.currentTime);
                tempoTotal.textContent = formatarTempo(reprodutor.duration);
            }
        });

        // Clique no círculo para buscar posição
        document.querySelector('.circulo-central').addEventListener('click', (e) => {
            if (musicas.length === 0 || isNaN(reprodutor.duration)) return;
            const circulo = e.currentTarget;
            const rect = circulo.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = e.clientX - cx;
            const dy = e.clientY - cy;
            let angulo = Math.atan2(dy, dx) + Math.PI / 2;
            if (angulo < 0) angulo += 2 * Math.PI;
            const progresso = angulo / (2 * Math.PI);
            reprodutor.currentTime = progresso * reprodutor.duration;
        });

        // === VOLUME ===
        btnVolume.addEventListener('click', () => {
            volumePopup.classList.toggle('aberto');
        });

        document.addEventListener('click', (e) => {
            if (!btnVolume.contains(e.target) && !volumePopup.contains(e.target)) {
                volumePopup.classList.remove('aberto');
            }
        });

        function atualizarVolumeUI(valor) {
            const altura = valor * 100;
            volumeSliderFill.style.height = `${altura}%`;
            volumePorcentagem.textContent = `${Math.round(altura)}%`;

            const icone = btnVolume.querySelector('i');
            if (valor === 0) {
                icone.className = 'fa fa-volume-off';
            } else if (valor < 0.5) {
                icone.className = 'fa fa-volume-down';
            } else {
                icone.className = 'fa fa-volume-up';
            }
        }

        function setVolumePorPosicao(clientY) {
            const rect = volumeSlider.getBoundingClientRect();
            const top = rect.top;
            const altura = rect.height;
            let valor = (rect.bottom - clientY) / altura;
            valor = Math.max(0, Math.min(1, valor));
            reprodutor.volume = valor;
            atualizarVolumeUI(valor);
        }

        volumeSlider.addEventListener('mousedown', (e) => {
            sliderVolumeDragging = true;
            setVolumePorPosicao(e.clientY);
        });

        document.addEventListener('mousemove', (e) => {
            if (!sliderVolumeDragging) return;
            setVolumePorPosicao(e.clientY);
        });

        document.addEventListener('mouseup', () => {
            sliderVolumeDragging = false;
        });

        // Suporte a toque
        volumeSlider.addEventListener('touchstart', (e) => {
            sliderVolumeDragging = true;
            setVolumePorPosicao(e.touches[0].clientY);
        });

        document.addEventListener('touchmove', (e) => {
            if (!sliderVolumeDragging) return;
            setVolumePorPosicao(e.touches[0].clientY);
        });

        document.addEventListener('touchend', () => {
            sliderVolumeDragging = false;
        });

        // === FORMATAR TEMPO ===
        function formatarTempo(segundos) {
            if (isNaN(segundos)) return '0:00';
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg.toString().padStart(2, '0')}`;
        }

        // === VISUALIZADOR DE ÁUDIO ===
        function inicializarVisualizador() {
            if (!contextoAudio) {
                contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
                analisador = contextoAudio.createAnalyser();
                analisador.fftSize = 64;
                dadosFrequencia = new Uint8Array(analisador.frequencyBinCount);

                const fonte = contextoAudio.createMediaElementSource(reprodutor);
                fonte.connect(analisador);
                analisador.connect(contextoAudio.destination);

                visualizador.innerHTML = '';
                for (let i = 0; i < 16; i++) {
                    const barra = document.createElement('div');
                    barra.classList.add('barra-visual');
                    const corDestaque = temas[localStorage.getItem('temaSelecionado') || '1'].destaque;
                    barra.style.backgroundColor = corDestaque;
                    visualizador.appendChild(barra);
                }
            }

            animarVisualizador();
        }

        function animarVisualizador() {
            if (!analisador) return;
            analisador.getByteFrequencyData(dadosFrequencia);
            const barras = visualizador.querySelectorAll('.barra-visual');
            const alturaMax = 110;

            barras.forEach((barra, i) => {
                const valor = dadosFrequencia[i * 2] / 255;
                barra.style.height = `${valor * alturaMax}px`;
            });

            animacaoVisualizador = requestAnimationFrame(animarVisualizador);
        }

        reprodutor.addEventListener('play', () => {
            if (contextoAudio && contextoAudio.state === 'suspended') contextoAudio.resume();
        });
    </script>
</body>
</html>
